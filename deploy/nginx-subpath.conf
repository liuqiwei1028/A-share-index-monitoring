# 把 A股指标监测 挂到已有站点的子路径 /etf/
# 项目目录：/opt/etf-monitor
#
# 把下面四段插到 https server {} 里、location / { proxy_pass ... } 之前。
# 完整示例见同目录的 boxtool.conf。

# 1) 补斜杠，否则页面里的相对路径（vendor/、data/）会解析错
location = /etf { return 301 /etf/; }

# 2) 数据文件禁缓存
location /etf/data/ {
    alias /opt/etf-monitor/data/;
    # .md / .csv 没有 MIME 映射，会被当成 application/octet-stream，补成 text/plain
    default_type text/plain;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
}

# 3) 图表库体积大、不常变，单独长缓存
#    expires 已经会生成 Cache-Control，不要再 add_header 一遍
location /etf/vendor/ {
    alias /opt/etf-monitor/vendor/;
    expires 30d;
}

# 4) 站点本体
location /etf/ {
    alias /opt/etf-monitor/;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
