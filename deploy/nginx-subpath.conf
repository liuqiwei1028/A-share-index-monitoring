# 把 A股指标监测 挂到已有站点下，路径 /etf/
# 文件放在 /var/www/boxtool/etf/（index.html、vendor/、data/、scripts/ 都在里面）
#
# 把下面三段插到 https server {} 里、location / { proxy_pass ... } 之前。
# 注意：nginx 的 add_header 不会继承，location 内一旦写了 add_header，
# 服务器级的几个安全头就失效了，所以这里重复声明一遍。

# 1) 补斜杠，否则页面里的相对路径（vendor/、data/）会解析错
location = /etf { return 301 /etf/; }

# 2) 数据文件禁缓存（放在最前面，精确匹配优先）
location = /etf/data/indicators.js {
    root /var/www/boxtool;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
}

# 3) 静态站点本体
location /etf/ {
    root /var/www/boxtool;
    index index.html;
    try_files $uri $uri/ =404;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# 4) 图表库体积大且不常变，单独给它长缓存
#    expires 已经会生成 Cache-Control，不要再 add_header 一遍，否则会出现两个头
location /etf/vendor/ {
    root /var/www/boxtool;
    expires 30d;
}
