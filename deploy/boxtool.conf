# ============================================================
# boxtool.net 站点配置（在原配置基础上增加 /etf/ 指标站点）
#
# 项目放在 /opt/etf-monitor
# 上传到 /etc/nginx/conf.d/boxtool.conf（或 sites-available 后 ln -s）
# 然后：nginx -t && systemctl reload nginx
#
# 注意：静态目录用 alias 而不是 root —— 项目在 /opt/etf-monitor，
# 若用 root 会把 URI 拼上去变成 /opt/etf-monitor/etf/xxx，导致 404。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name boxtool.net www.boxtool.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boxtool.net www.boxtool.net;

    access_log /var/log/nginx/boxtool-access.log;
    error_log  /var/log/nginx/boxtool-error.log;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 40m;

    # ---------- A股指标监测（静态站点，/etf/）----------
    # 带斜杠跳转：少了这条，访问 /etf 时页面里的相对路径会解析成 /vendor/、/data/
    location = /etf {
        return 301 /etf/;
    }

    # 数据文件禁缓存（nginx 的 add_header 不继承，安全头在此重新声明）
    location /etf/data/ {
        alias /opt/etf-monitor/data/;
        # .md / .csv 没有 MIME 映射，补一个，否则被当成 application/octet-stream
        default_type text/plain;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 图表库体积大、不常变，单独长缓存
    location /etf/vendor/ {
        alias /opt/etf-monitor/vendor/;
        expires 30d;
    }

    # 站点本体
    location /etf/ {
        alias /opt/etf-monitor/;
        index index.html;

        gzip on;
        gzip_min_length 1024;
        gzip_types text/html text/css application/javascript application/json;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---------- 原有反代站点 ----------
    #location / {
    #    proxy_pass http://127.0.0.1:3000;
    #    proxy_http_version 1.1;
    #    proxy_set_header Host $host;
